plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'kotlin-parcelize'
    id 'kotlin-kapt'
}

android {

    signingConfigs {
        release {
            storeFile file('/home/chaolee/AndroidStudioProjects/keystore/new_key.jks')
            storePassword '86637971'
            keyAlias = 'chaolee1959'
            keyPassword '86637971'
        }
    }

    compileSdk sdk_version.compile

    defaultConfig {

        targetSdk sdk_version.target
        minSdk sdk_version.min

        versionCode 970
        versionName "9.70"

        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        signingConfig signingConfigs.release
    }

    flavorDimensions += ["karaoke"]
    productFlavors {
        create("karaokeplayer") {
            dimension = "karaoke"
            applicationId = "com.smile.karaokeplayer"
            isDefault = true
        }
        create("videoplayer") {
            dimension = "karaoke"
            applicationId = "com.smile.videoplayer"
        }
        create("karaoketvplayer") {
            dimension = "karaoke"
            applicationId = "com.smile.karaoketvplayer"
        }
        create("karaokeplayer2") {
            // for Amazon app store only
            // has same package name with "karaokeplayer"
            dimension = "karaoke"
            applicationId = "com.smile.karaokeplayer"
        }
    }

    sourceSets {
        main {
            java.srcDir("src/main/java")
            resources.srcDir("src/main/rec")
            manifest {
                srcFile "src/main/AndroidManifest.xml"
            }
        }
        karaokeplayer {
            java {
                srcDirs += "src/karaokeplayer/java"
            }
            res.srcDirs += "src/karaokeplayer/res"
            manifest {
                srcFile "src/karaokeplayer/AndroidManifest.xml"
            }
        }

        videoplayer {
            java.srcDirs += "src/videoplayer/java"
            res.srcDirs += "src/videoplayer/res"
            manifest {
                srcFile "src/videoplayer/AndroidManifest.xml"
            }
        }

        karaoketvplayer {
            java.srcDirs += ["src/karaoketvplayer/java", "src/karaokeplayer/java", "src/videoplayer/java"]
            res.srcDirs += ["src/karaoketvplayer/res", "src/karaokeplayer/res", "src/videoplayer/res"]
            manifest {
                srcFile "src/karaoketvplayer/AndroidManifest.xml"
            }
        }

        karaokeplayer2 {
            java.srcDirs += ["src/karaokeplayer2/java","src/karaoketvplayer/java",
                             "src/karaokeplayer/java", "src/videoplayer/java"]
            res.srcDirs += ["src/karaoketvplayer/res", "src/karaokeplayer/res", "src/videoplayer/res"]
            manifest {
                srcFile "src/karaokeplayer2/AndroidManifest.xml"
            }
        }
    }

    /*
    variantFilter { variant ->
        def flavorName = variant.getFlavors().get(0).name
        if (flavorName != "flavor1") {
            dependencies.add(flavorName + "Implementation", "com.example:some-library:1.0.0")
        }
    }
    */

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    /*
    kotlinOptions {
        jvmTarget = '17'    // deprecated
        // for default fun of Kotlin
        freeCompilerArgs = ['-Xjvm-default=all']    // deprecated
    }
    */

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }

    buildFeatures  {
        dataBinding true    // viewBinding true
        buildConfig true
        compose true
    }

    namespace 'com.smile.karaoke'
    // testNamespace 'com.smile.karaoke.androidTest'
}

allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:unchecked" << "-Xlint:deprecation"
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.media:media:1.7.1'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "androidx.annotation:annotation:1.9.1"
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-ads:23.6.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'

    implementation 'com.facebook.android:audience-network-sdk:6.21.0'
    implementation 'com.facebook.infer.annotation:infer-annotation:0.18.0'
    implementation 'com.google.ads.mediation:facebook:6.20.0.2'
    // InMobi's SDK
    implementation 'com.inmobi.monetization:inmobi-ads-kotlin:11.0.0'
    // AdMob's InMobi adapter
    implementation 'com.google.ads.mediation:inmobi:10.8.8.1'
    // ironSource's SDK
    implementation 'com.unity3d.ads-mediation:mediation-sdk:9.0.0'
    // AdMob's ironSource adapter
    implementation 'com.google.ads.mediation:ironsource:9.0.0.1'
    // applovin's SDK
    implementation 'com.applovin:applovin-sdk:13.5.0'
    // AppLovin AdMob adapter
    implementation 'com.google.ads.mediation:applovin:13.5.0.0'

    // Compose BOM (Bill of Materials) - Recommended for managing versions
    // Use the latest BOM version
    implementation platform('androidx.compose:compose-bom:2025.10.01')
    // Compose Runtime
    implementation 'androidx.compose.runtime:runtime'
    // Other Compose dependencies you might be using (UI, Material, etc.)
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3' // Or material
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.activity:activity-ktx:1.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.activity:activity-compose:1.11.0'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'androidx.media3:media3-cast:1.8.0'  // for exoplayer and vlcplayer
    // implementation 'com.google.android.gms:play-services-cast-framework:22.1.0'

    implementation "com.android.billingclient:billing-ktx:8.0.0"

    implementation 'androidx.tracing:tracing-perfetto-handshake:1.0.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'

    implementation files('libs/smilelibraries-release.aar')
    implementation files('libs/NativeTemplatesModels-release.aar')

    /*
    implementation("io.ktor:ktor-server-core-jvm:3.2.0") // Or latest version
    implementation("io.ktor:ktor-server-cio-jvm:3.2.0")  // CIO engine for Ktor
    implementation("io.ktor:ktor-server-content-negotiation-jvm:3.2.0") // For content negotiation if needed
    implementation("io.ktor:ktor-serialization-kotlinx-json-jvm:3.2.0") // If you need JSON
    */

    // This block runs after the project is configured
    afterEvaluate {
        android.applicationVariants.all { variant ->
            variant.productFlavors.each { flavor ->
                // println("variant.name = ${variant.name}")
                if (flavor.name.containsIgnoreCase("karaokeplayer")
                        || flavor.name.containsIgnoreCase("karaoketvplayer")
                        || flavor.name.containsIgnoreCase("karaokeplayer2")) {
                    // Dynamically add a dependency to this variant
                    dependencies.add(variant.name + "Implementation", "androidx.media3:media3-exoplayer:1.8.0")
                    dependencies.add(variant.name + "Implementation", "androidx.media3:media3-exoplayer-dash:1.8.0")
                    dependencies.add(variant.name + "Implementation", "androidx.media3:media3-decoder:1.8.0")
                    dependencies.add(variant.name + "Implementation", "androidx.media3:media3-ui:1.8.0")
                    dependencies.add(variant.name + "Implementation", "androidx.media3:media3-session:1.8.0")
                    dependencies.add(variant.name + "Implementation", project(":extension-ffmpeg"))
                    dependencies.add(variant.name + "Implementation", project(":extension-flac"))
                    dependencies.add(variant.name + "Implementation", project(":extension-opus"))
                    dependencies.add(variant.name + "Implementation", project(":extension-av1"))
                    // dependencies.add(variant.name + "Implementation", project(":extension-vp9"))
                    // Note: You use the full variant name (e.g., "karaokeplayerDebugImplementation")
                }
                if (flavor.name.containsIgnoreCase("videoplayer")
                        || flavor.name.containsIgnoreCase("karaoketvplayer")
                        || flavor.name.containsIgnoreCase("karaokeplayer2")) {
                    dependencies.add(variant.name + "Implementation", "org.videolan.android:libvlc-all:3.6.5")
                    // Note: You use the full variant name (e.g., "videoDebugImplementation")
                }
            }
        }
    }

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation platform('androidx.compose:compose-bom:2025.10.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:truth:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}

apply plugin: 'com.google.gms.google-services'
