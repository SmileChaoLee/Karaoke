
apply plugin: 'com.android.library'

android {
    compileSdk sdk_version.compile

    defaultConfig {
        targetSdk sdk_version.target
        minSdk sdk_version.min
        consumerProguardFiles 'proguard-rules.txt'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        // for cmake's variant configurations
        externalNativeBuild {
            // cmake here is for the variant configurations
            cmake {
                targets "opusV2JNI" // deprecated, no need when use CmakeLists.txt
            }
        }
        // NDK configurations within defaultConfig
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    ndkVersion '27.3.13750724'
    externalNativeBuild {
        cmake {
            path file('../opus/src/main/jni/CMakeLists.txt')
            version '3.21.0+'
        }
    }

    namespace 'androidx.media3.decoder.opus'
}

dependencies {
    implementation "androidx.annotation:annotation:1.9.1"
    implementation 'androidx.media3:media3-common:1.8.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-decoder:1.8.0'
    compileOnly 'org.checkerframework:checker-qual:3.49.5'
    compileOnly 'org.jetbrains.kotlin:kotlin-annotations-jvm:1.9.22'
}
